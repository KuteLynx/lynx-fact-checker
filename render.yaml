services:
  - type: web
    name: lynx-fact-checker-api
    runtime: image
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: CORS_ORIGINS
        # ⚠️ REEMPLAZAR por la URL del frontend en GitHub Pages
        # Ejemplo: https://tuusuario.github.io
        value: "https://CAMBIAR-ESTA-URL.github.io"
      - key: PORT
        value: 8000
      # ⚠️ OPENAI_API_KEY: configurar vía Dashboard de Render como secret
      # Dashboard → Environment → Agregar OPENAI_API_KEY
