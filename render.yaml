services:
  - type: web
    name: lynx-fact-checker-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://TU_USUARIO.github.io
      - key: PORT
        value: 8000
